name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    frontend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps: 
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci
                
            - name: Build
              run: npm run build
        
    backend:
        runs-on: ubuntu-latest

        defaults:
          run: 
            working-directory: backend

        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Seed test database
              run: npm run seed

            - name: Test
              run: npm test